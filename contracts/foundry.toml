[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@ens/=lib/contracts-v2/contracts/src/",
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
